.demo .wrap{display:flex;gap:12px;align-items:flex-start;padding-block:10px}
.demo p{flex:1;line-height:1.55}
.demo b{font-weight:600;unicode-bidi:isolate}

main{display:block;outline:none;padding-bottom:16px}
.page-h{padding-block:30px 20px}
.page-h h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:600}
.page-h p{margin-top:6px;color:var(--muted);max-width:62ch}
.sec{margin-block:30px 34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:1.28rem;font-weight:600;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.lead{color:var(--muted);margin:10px 0 4px;max-width:62ch;line-height:1.6}
.empty{padding:16px 0;color:var(--muted);font-family:var(--f-display);font-size:.95rem}
.two{display:grid;gap:0 52px}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* ---------- level tags & swatches ---------- */
.tags{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.lv{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:.8rem;font-weight:400;color:var(--muted);line-height:1.25;white-space:nowrap}
.sw{flex:none;display:inline-block;width:15px;height:15px;border:1px solid var(--ink);background-color:var(--fill,transparent);background-image:var(--pat,none);background-size:calc(var(--pw,12px)*.5) calc(var(--ph,12px)*.5)}

/* ---------- home: lockup + hero ---------- */
.lockup{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;padding-block:18px 10px;border-bottom:1.5px solid var(--ink);font-family:var(--f-display);font-size:.86rem;color:var(--muted);line-height:1.45}
.hero{display:grid;gap:34px;padding-block:28px 22px}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:60px;align-items:center;padding-block:44px 34px}}
.hero h1{font-size:clamp(2.7rem,10vw,4.9rem);font-weight:700;line-height:1.02}
html[lang="fr"] .hero h1{font-size:clamp(2.2rem,7.4vw,3.8rem);line-height:1.05}
.alt-title{margin-top:12px;font-family:var(--f-display);font-weight:300;font-size:clamp(1.15rem,3.6vw,1.6rem);color:var(--muted);line-height:1.3}
.who{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);display:grid;gap:2px;max-width:34rem}
.who b{font-family:var(--f-display);font-weight:600;font-size:1.22rem}
.who span{color:var(--muted);line-height:1.5}

/* ---------- the stratigraphic column ---------- */
.log{--axis:5.6rem;display:block}
.log .row{display:grid;grid-template-columns:var(--axis) minmax(0,1fr)}
.log .age{align-self:center;padding-inline-end:12px;text-align:end;font-family:var(--f-display);font-size:.82rem;color:var(--muted);line-height:1.25}
.log .beds{display:flex;min-height:86px;border-inline:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.soilband{line-height:0;color:var(--grass);border-bottom:3px solid var(--soil)}
.grass{display:block;width:100%;height:18px}
.bed{flex:1 1 0;min-width:0;display:flex;align-items:center;padding:12px;background-color:var(--fill);background-image:var(--pat);color:var(--ink);text-decoration:none}
.bed + .bed{border-inline-start:2px dashed var(--ink)}
.plate{display:inline-flex;flex-direction:column;gap:1px;max-width:100%;padding:7px 11px 8px;background:var(--plate);color:var(--ink);border:1px solid var(--ink);border-radius:4px;font-family:var(--f-display);line-height:1.25;transition:transform .16s ease}
.plate b{font-weight:600;font-size:1rem}
.plate small{font-size:.8rem;color:var(--muted)}
.bed:hover .plate{transform:translateY(-2px)}
.bed:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.log .socle .beds{min-height:30px;background-color:var(--fill);background-image:var(--pat)}
.log-cap{margin-top:12px;margin-inline-start:var(--axis);font-family:var(--f-display);font-size:.86rem;color:var(--muted);line-height:1.55;max-width:44ch}
@media (max-width:420px){.log{--axis:4.6rem}.log .beds{min-height:92px}.bed{padding:10px 8px}.plate{padding:6px 8px 7px}.plate b{font-size:.93rem}}
@media (prefers-reduced-motion:no-preference){
  .log.settle .row{animation:deposit .7s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s)}
}
@keyframes deposit{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}

/* ---------- home: lists ---------- */
.home-grid{display:grid;gap:0 56px}
@media (min-width:900px){.home-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.ann,.ev,.logs{list-style:none;margin:0;padding:0}
.ann li,.logs li{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:0 16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.ann time,.logs time{font-family:var(--f-display);font-size:.84rem;color:var(--muted);line-height:1.35;padding-top:3px}
.ann h3{font-size:1.06rem;font-weight:600;line-height:1.4}
.ann p{margin-top:4px;line-height:1.6}
.ann .more{display:inline-block;margin-top:6px;font-family:var(--f-display);font-size:.9rem}
.ev li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:0 14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule)}
.ev .d{text-align:center;font-family:var(--f-display);line-height:1.05}
.ev .d b{display:block;font-size:1.6rem;font-weight:600}
.ev .d span{font-size:.76rem;color:var(--muted)}
.ev h3{font-size:1rem;font-weight:600;line-height:1.4}
.ev .tags{margin-top:3px}
.cd{font-family:var(--f-display);font-size:.84rem;color:var(--action);white-space:nowrap}
.cd.hot{color:var(--ink);font-weight:600}
.lab p{margin:12px 0 14px;color:var(--muted);line-height:1.6;max-width:52ch}
.fact-b{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-top:14px}
.fact-b svg{width:42px;height:42px;color:var(--muted)}
.fact-b p{font-size:1.1rem;line-height:1.6}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:.95rem;font-weight:500;padding:9px 16px;border:1px solid var(--ink);border-radius:var(--radius);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;line-height:1.3}
.btn:hover{background:transparent;color:var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.btn[aria-disabled="true"]{background:transparent;color:var(--muted);border-color:var(--rule);cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.iconbtn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:var(--radius);background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:32px;height:32px}

/* ---------- chips, filters, search ---------- */
.lvbar,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.lvbar::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.lvbar button,.chips button{flex:none;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--rule);border-radius:var(--radius);background:transparent;color:var(--muted);font-family:var(--f-display);font-size:.92rem;cursor:pointer;line-height:1.3}
.lvbar button:hover,.chips button:hover{color:var(--ink);border-color:var(--muted)}
.lvbar button[aria-pressed="true"],.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.filters{display:grid;gap:10px}
.field{display:flex;align-items:center;gap:8px;padding-inline:12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--plate)}
.field:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--f-display);font-size:1rem;padding:11px 0;outline:none}
.count{margin-top:16px;font-family:var(--f-display);font-size:.85rem;color:var(--muted)}

/* ---------- cours ---------- */
.lvhead{display:grid;gap:10px;margin-top:22px;padding-block:16px 18px;border-bottom:1.5px solid var(--ink)}
.lvhead h2{font-size:clamp(1.35rem,4.6vw,1.85rem);font-weight:600;line-height:1.3}
.prog{display:grid;gap:6px;max-width:520px;margin-top:4px}
.prog-bar{height:10px;border:1px solid var(--ink);background:var(--paper-2)}
.prog-bar i{display:block;height:100%;background-color:var(--fill);background-image:var(--pat);background-size:calc(var(--pw)*.6) calc(var(--ph)*.6)}
.prog span{font-family:var(--f-display);font-size:.86rem;color:var(--muted)}
.prog span b{color:var(--ink);font-weight:600}
.unit{margin-top:30px}
.unit-h{display:grid;gap:2px}
.unit-h .k{font-family:var(--f-display);font-size:.82rem;color:var(--muted)}
.unit-h h3{font-size:1.2rem;font-weight:600;line-height:1.4}
.chaps{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.chaps li{position:relative;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.chaps .n{font-family:var(--f-display);font-size:1.15rem;font-weight:500;color:var(--muted);text-align:center;line-height:1.55}
.chaps .t{display:block;font-weight:600;line-height:1.5}
.chaps .res{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-family:var(--f-display);font-size:.9rem}
.chaps .soon{color:var(--muted);font-size:.84rem}
.chaps li.now::before{content:"";position:absolute;inset-block:-1px;inset-inline-start:-14px;width:7px;background-color:var(--fill);background-image:var(--pat);border:1px solid var(--ink)}
.chaps li.now .n{color:var(--ink);font-weight:600}
.now-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;font-family:var(--f-display);font-size:.82rem;font-weight:600;color:var(--ink)}
.now-tag svg{width:20px;height:20px}

/* ---------- ressources ---------- */
.rlist{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule)}
.rlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule)}
.rlist .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.rlist .t{display:block;font-weight:600;line-height:1.45;margin-top:2px}
.go{font-family:var(--f-display);font-size:.95rem;white-space:nowrap}
.na{font-family:var(--f-display);font-size:.82rem;color:var(--muted);white-space:nowrap}
.tablewrap{overflow-x:auto;margin-top:12px}
.exams{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.93rem;min-width:300px}
.exams th,.exams td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--rule);white-space:nowrap}
.exams thead th{font-weight:500;font-size:.82rem;color:var(--muted);border-bottom:1.5px solid var(--ink)}
.exams tbody th{font-weight:600}
.exams td a + a{margin-inline-start:14px}
.note{margin-top:10px;font-family:var(--f-display);font-size:.8rem;color:var(--muted)}

/* ---------- classe ---------- */
.tt{border-top:0}
.tt-day{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:0 12px;padding-block:12px;border-bottom:1px solid var(--rule)}
.tt-day .dn{font-family:var(--f-display);font-weight:500;color:var(--muted);line-height:1.4}
.tt-day.today .dn{color:var(--ink);font-weight:600}
.tt-day .dn small{display:block;font-size:.76rem;font-weight:500;color:var(--action)}
.sess{display:grid;gap:8px}
.ses{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;font-family:var(--f-display);font-size:.95rem}
.ses time{min-width:6.6rem;color:var(--muted);font-size:.9rem;unicode-bidi:isolate}
.ses .lv{font-size:.9rem;color:var(--ink)}
.ses .room{color:var(--muted);font-size:.86rem}
.tt-day .none{color:var(--muted);font-family:var(--f-display);font-size:.88rem}
.logs dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0 0}
.logs dt{font-family:var(--f-display);font-size:.8rem;color:var(--muted);padding-top:4px}
.logs dd{margin:0;line-height:1.55}
.rules{list-style:none;margin:6px 0 0;padding:0}
.rules li{position:relative;padding-block:10px;padding-inline-start:24px;border-bottom:1px solid var(--rule);line-height:1.6}
.rules li::before{content:"";position:absolute;inset-inline-start:3px;top:1.15em;width:8px;height:8px;border:1.5px solid var(--ink);transform:rotate(45deg)}

/* ---------- méthodologie ---------- */
.split{display:flex;margin-top:16px;border:1.5px solid var(--ink);font-family:var(--f-display)}
.split > div{display:flex;align-items:baseline;gap:6px;padding:10px 12px}
.split .p1{flex:5 1 0;background:var(--paper-2);border-inline-end:1.5px solid var(--ink)}
.split .p2{flex:15 1 0}
.split b{font-size:1.4rem;font-weight:600;line-height:1}
.split span{font-size:.82rem;color:var(--muted)}
.parts{display:grid;gap:14px;margin-top:14px}
@media (min-width:720px){.parts{grid-template-columns:1fr 3fr;gap:24px}}
.parts h3{font-size:1.02rem;font-weight:600;line-height:1.4}
.parts p{margin-top:4px;color:var(--muted);line-height:1.6}
.verbs{margin-top:10px;border-top:1px solid var(--rule)}
.verb{display:grid;grid-template-columns:minmax(8rem,13rem) minmax(0,1fr);gap:4px 20px;padding-block:12px;border-bottom:1px solid var(--rule)}
@media (max-width:560px){.verb{grid-template-columns:1fr}}
.verb b{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.35}
.verb p{line-height:1.6}
.steps{list-style:none;margin:14px 0 0;padding:0;counter-reset:st;display:grid;gap:14px}
.steps li{counter-increment:st;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:12px;align-items:start;line-height:1.6}
.steps li::before{content:counter(st);display:grid;place-items:center;width:2rem;height:2rem;border:1.5px solid var(--ink);border-radius:50%;font-family:var(--f-display);font-weight:600;font-size:.95rem}

/* ---------- lexique ---------- */
.lex{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule)}
.lex li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding-block:10px;border-bottom:1px solid var(--rule)}
.lex .a{font-weight:600;line-height:1.45}
.lex .f{font-family:var(--f-display);line-height:1.45;font-size:.98rem}

/* ---------- outils ---------- */
.calc{display:grid;gap:8px;margin-top:14px}
.calc .hdr,.calc .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.calc .hdr span{font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.calc input,.need input{width:100%;font-family:var(--f-display);font-size:1.05rem;padding:9px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--plate);color:var(--ink);text-align:center}
.calc input:focus,.need input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.calc .btn{justify-self:start;margin-top:4px}
.result{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:12px;border-top:1.5px solid var(--ink);font-family:var(--f-display);min-height:3.4rem}
.result b{font-size:2.1rem;font-weight:600;line-height:1;unicode-bidi:isolate}
.result span{color:var(--muted);font-size:.9rem}
.need{display:grid;gap:12px;margin-top:14px}
.need label{display:grid;gap:5px;font-family:var(--f-display);font-size:.85rem;color:var(--muted)}
.need .msg{font-family:var(--f-display);font-size:1.02rem;line-height:1.55;padding-top:12px;border-top:1.5px solid var(--ink);min-height:3.4rem}
.need .msg b{font-size:1.6rem;font-weight:600;unicode-bidi:isolate}

/* ---------- footer ---------- */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;margin-top:36px;padding-block:16px 30px;border-top:1.5px solid var(--ink);font-family:var(--f-display);font-size:.86rem;color:var(--muted);line-height:1.55}
.foot a{color:inherit}
.foot .grp{display:flex;flex-wrap:wrap;gap:4px 20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.demo,.skip,.lvbar,.chips,.filters,.btn,.iconbtn,.log-cap{display:none!important}
  :root{--paper:#fff;--paper-2:#fff;--ink:#000;--muted:#333;--rule:#999;--plate:#fff;--action:#000}
  body{font-size:12pt}
  a{text-decoration:none}
}
#brandIcon{display:inline-flex;flex:none}
main:focus,main:focus-visible{outline:none}
html[dir="rtl"] :is(.alt,.o,.alt-title){text-align:right}
html[dir="ltr"] :is(.alt,.o,.alt-title){text-align:left}
.lex{max-width:780px}
.tablewrap{max-width:720px}
</style>
</head>

<a class="skip" id="skip" href="#main">تخطَّ إلى المحتوى</a>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#home"><span id="brandIcon" aria-hidden="true"></span><span class="brand-t"><b id="brandT">علوم الحياة والأرض</b><small id="brandS"></small></span></a>
    <button class="tbtn" id="langBtn" type="button">FR</button>
    <button class="tbtn" id="themeBtn" type="button"></button>
  </div>
  <div class="wrap"><nav class="views" id="nav"></nav></div>
</header>
<div class="demo" id="demo" hidden></div>
<main id="main" class="wrap" tabindex="-1">

</main>

  for (let i = 0; i < 7; i++) { d += ` a${r} ${r} 0 0 1 ${dir * 2 * r} 0`; r += 2; dir = -dir; }

}

const ammonite = () => `<svg viewBox="8 7 34 32" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="${AMM.d}" stroke-width="2"/><path d="${AMM.ribs}" stroke-width="1.1"/></svg>`;
function grassSvg() {
  let d = "";
  for (let i = 0; i < 46; i++) {
    const x = 4 + i * 8.6 + ((i * 37) % 5) - 2, h = 7 + ((i * 53) % 8), lean = ((i * 29) % 7) - 3;
    d += `M${x.toFixed(1)} 18Q${(x + lean * .4).toFixed(1)} ${(18 - h * .6).toFixed(1)} ${(x + lean).toFixed(1)} ${(18 - h).toFixed(1)}`;
  }
  return `<svg class="grass" viewBox="0 0 400 18" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function needMsg() {
  const l = L();
  const notes = String(state.need.notes).split(/[\s،;+\/]+/).map(num).filter(x => Number.isFinite(x) && x >= 0 && x <= 20);
  const target = num(state.need.target);
  if (!notes.length || !Number.isFinite(target) || target < 0 || target > 20) return esc(l.needEmpty);
  const need = target * (notes.length + 1) - notes.reduce((a, b) => a + b, 0);
  if (need <= 0) return esc(l.needOk);
  if (need > 20) return esc(l.needHigh(fmtNum(need)));
  return l.needMsg(`<span dir="ltr">${fmtNum(Math.ceil(need * 4 - 1e-9) / 4)}</span>`);
}
function vOutils() {
  const l = L();
  return `
  <header class="page-h"><h1>${esc(l.outilsH)}</h1><p>${esc(l.outilsLead)}</p></header>
  <div class="two">
    <section class="sec"><h2 class="sec-h">${esc(l.avgH)}</h2><p class="lead">${esc(l.avgLead)}</p><div id="avg">${avgHtml()}</div></section>
    <section class="sec"><h2 class="sec-h">${esc(l.needH)}</h2><p class="lead">${esc(l.needLead)}</p>
      <div class="need">
        <label>${esc(l.needNotes)}<input id="nNotes" inputmode="decimal" dir="ltr" value="${esc(state.need.notes)}" placeholder="12 14,5 9" autocomplete="off"></label>
        <label>${esc(l.needTarget)}<input id="nTarget" inputmode="decimal" dir="ltr" value="${esc(state.need.target)}" placeholder="14" autocomplete="off"></label>
        <p class="msg" id="nMsg" aria-live="polite">${needMsg()}</p>
      </div>
    </section>
  </div>
  ${labBlock()}`;
}

/* ============ التوجيه والأحداث | Navigation et événements ============ */
const RENDER = { home: vHome, cours: vCours, ressources: vRess, classe: vClasse, methode: vMethode, lexique: vLex, outils: vOutils };
function render() {
  renderChrome();
  main.innerHTML = RENDER[state.view]();
  const nav = $("nav"), cur = nav.querySelector('[aria-current="page"]');
  if (cur && nav.scrollWidth > nav.clientWidth + 2) {
    const nr = nav.getBoundingClientRect(), cr = cur.getBoundingClientRect();
    if (cr.left < nr.left || cr.right > nr.right) nav.scrollLeft += (cr.left + cr.width / 2) - (nr.left + nr.width / 2);
  }
}
function route() {
  const [v, p] = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  state.view = VIEWS.includes(v) ? v : "home";
  if (state.view === "cours" && LV[p]) { state.level = p; store.set("level", p); }
  render();
}
window.addEventListener("hashchange", () => {
  route();
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
});
doc.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const refocus = () => { const el = doc.querySelector(`[data-act="${act}"][data-v="${v}"]`); if (el) el.focus({ preventScroll: true }); };
  switch (act) {
    case "level":
      if (LV[v]) { state.level = v; store.set("level", v); if (location.hash !== "#cours/" + v) location.hash = "#cours/" + v; else { render(); refocus(); } }
      break;
    case "rlv": state.res.lv = v; render(); refocus(); break;
    case "rty": state.res.ty = v; render(); refocus(); break;
    case "extrack": state.exTrack = v; render(); refocus(); break;
    case "clv": state.classLv = v; store.set("classLv", v); render(); refocus(); break;
    case "lg": state.lex.g = v; render(); refocus(); break;
    case "addrow": {
      state.avg.push({ n: "", c: "1" });
      $("avg").innerHTML = avgHtml();
      const ins = $("avg").querySelectorAll('input[data-k="n"]');
      if (ins.length) ins[ins.length - 1].focus();
      break;
    }
    case "delrow":
      if (state.avg.length > 1) { state.avg.splice(+v, 1); $("avg").innerHTML = avgHtml(); }
      break;
    case "demo-x": state.demoHidden = true; renderChrome(); break;
  }
});
main.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "rq") { state.res.q = el.value; $("rlist").innerHTML = ressListHtml(); }
  else if (el.id === "lq") { state.lex.q = el.value; $("lexlist").innerHTML = lexListHtml(); }
  else if (el.dataset.k && el.closest(".calc")) { const r = state.avg[+el.dataset.i]; if (r) { r[el.dataset.k] = el.value; $("avgRes").innerHTML = avgResult(); } }
  else if (el.id === "nNotes" || el.id === "nTarget") { state.need[el.id === "nNotes" ? "notes" : "target"] = el.value; $("nMsg").innerHTML = needMsg(); }
});
$("skip").addEventListener("click", e => { e.preventDefault(); main.focus(); });
$("langBtn").addEventListener("click", () => { state.lang = OTHER(); store.set("lang", state.lang); render(); });
$("themeBtn").addEventListener("click", () => { const next = isDark() ? "light" : "dark"; root.dataset.theme = next; store.set("theme", next); updateThemeBtn(); });
if (mq) { if (mq.addEventListener) mq.addEventListener("change", updateThemeBtn); else if (mq.addListener) mq.addListener(updateThemeBtn); }

const fav = $("fav");
if (fav) fav.href = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 7 34 32"><circle cx="25" cy="23" r="16" fill="#F3F5F2"/><g fill="none" stroke="#1C2A2A" stroke-linecap="round"><path d="${AMM.d}" stroke-width="2.2"/><path d="${AMM.ribs}" stroke-width="1.2"/></g></svg>`);

route();
})();
</script>
